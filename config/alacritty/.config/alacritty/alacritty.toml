# TERM
[env]
TERM = "xterm-256color"

# Window
[window]
dynamic_padding = false

[window.dimensions]
columns = 95
lines = 35

[window.padding]
x = 20
y = 20

# Font
[font]
size = 13

[font.normal]
family = "Pragmasevka Nerd Font"
style = "Regular"

[font.bold]
family = "Pragmasevka Nerd Font"
style = "Bold"

[font.italic]
family = "Pragmasevka Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Pragmasevka Nerd Font"
style = "Bold Italic"

# Colors
[colors.primary]
background = "#14151e"
foreground = "#98b0d3"

[colors.cursor]
text = "#a5b6cf"
cursor = "#cbced3"

[colors.selection]
text = "#a5b6cf"
background = "#1c1e27"

[colors.normal]
black   = "#151720"
red     = "#dd6777"
green   = "#90ceaa"
yellow  = "#ecd3a0"
blue    = "#86aaec"
magenta = "#c296eb"
cyan    = "#93cee9"
white   = "#cbced3"

[colors.bright]
black   = "#4f5572"
red     = "#e26c7c"
green   = "#95d3af"
yellow  = "#f1d8a5"
blue    = "#8baff1"
magenta = "#c79bf0"
cyan    = "#98d3ee"
white   = "#d0d3d8"

# URL hints (closest equivalent to kitty's url_color)
[[hints.enabled]]
regex = "(https?|ftp)://[^\\s]+"
command = "xdg-open"
post_processing = true

[hints.enabled.mouse]
enabled = true

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

# Keybinding (replacement for kitty_mod+t)
[[keyboard.bindings]]
key = "T"
mods = "Control|Shift"
action = "SpawnNewInstance"
