; --------
; nibir's polybar config
; --------

[var]
today = ${file:/home/nibir/today.txt}
; today = ${env:TODAY:live.}

[colors]
background = #1a1e23
background-alt = #373B41
foreground = #d2d4d3
primary = #cd5d67
secondary = #009999
alert = #A54242
disabled = #707880

[bar/second]
wm-name = second-bar
width = 100%
height = 18pt
radius = 0

; dpi = 96
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 0
border-color = #00000000

padding-left = 0
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

font-1 = Iosevka Term;2
font-0 = Pragmasevka Nerd Font;2
font-2 = JetBrainsMono Nerd Font;2
;font-1 = EnvyCodeR Nerd Font;2

modules-left = xworkspaces dayprogress
modules-center = today countdown
modules-right = tray battery pulseaudio date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm

[module/tray]
type = internal/tray
tray-size = 60%
tray-padding = 2
tray-foreground = ${colors.foreground-alt}
tray-background = ${colors.background}

[module/sep]
type = custom/text
label = "|"
label-foreground = ${colors.disabled}
label-background = ${colors.background}

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "vol "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#009999}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base 
interface-type = wireless
label-connected = %{F#009999}NET%{F-} %essid%

[module/date]
type = internal/date
interval = 1

date-alt = %A, %d %B - %H:%M
date = %H:%M

label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/battery]
type = internal/battery

full-at = 98
battery = BAT0
adapter = ACAD
poll-interval = 15
time-format = %H:%M

format-charging = <label-charging>
format-charging-prefix = "bat "
format-charging-prefix-background = ${colors.background}
format-charging-prefix-foreground = ${colors.primary}
format-charging-background = ${colors.background}
format-charging-foreground = ${colors.foreground}
format-charging-padding = 0
format-discharging = <label-discharging>
format-discharging-background = ${colors.background}
format-discharging-foreground = ${colors.foreground}
format-discharging-padding = 0
format-discharging-prefix = "bat "
format-discharging-prefix-background = ${colors.background}
format-discharging-prefix-foreground = ${colors.primary}
format-full = <label-full>
format-full-background = ${colors.background}
format-full-foreground = ${colors.foreground}
format-full-padding = 0
label-charging = "^%percentage%%"
label-discharging = "%percentage%%"
label-full = "Full"

[module/tomato]
type = custom/script

exec = value=$(< /home/nibir/.local/share/tomato/time.log); [ "$value" = "00:00" ] && echo "" || echo "$value"
;exec = cat /home/nibir/.local/share/tomato/time.log
interval = 1

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-padding = 1

label = %output%

[module/live]
type = custom/text
label = "live."
label-foreground = ${colors.foreground}
label-background = ${colors.background}

[module/quote]
type = custom/script
exec = curl -fsSL "https://stoic-quotes.com/api/quote" | jq -r '.text'
; exec = curl -fsSL https://stoicquotesapi.com/v1/api/quotes/random | sed -E 's/.*"body":"([^"]+)".*/\1/'
; exec = curl -fsSL https://api.quotable.io/random?maxLength=80 | jq -r '.content'
label = %output%
interval = 3600

[module/timew]
type = custom/script

exec = timew | grep -q '^Tracking' && timew | awk 'NR==1 { sub(/^Tracking /, "", $0); out = $0 } /Total/ { print out, $NF }' || echo "No tracking yet"
interval = 1
format = <label>
label = %output%
click-right = timew stop

[module/today]
type = custom/ipc
hook-0 = cat /home/nibir/today.txt
initial = 1

[module/dayprogress]
type = custom/script
exec = bash ~/.config/polybar/scripts/dayprogress.sh
interval = 300

format = <label>
label = %output%

[module/countdown]
type = custom/script
exec = bash ~/.config/polybar/scripts/countdown.sh

# Update every 60 seconds to keep the hour count accurate
interval = 1800

format = <label>
label = %output%

;[module/media]
;type = custom/script

;exec = bash ~/.config/polybar/scripts/player.sh
;interval = 5 
;tail = false

;label = %output%
;format = <label>
;format-background = ${colors.background}
;format-foreground = ${colors.foreground}
;format-padding = 1

;click-left = playerctl --player=spotify,cmus,ncspot,stmps play-pause
;click-right = playerctl --player=spotify,cmus,ncspot,stmps next

