bar {
    position bottom

    #status_command while date +'%Y-%m-%d %R'; do sleep 1; done
    status_command i3status-rs

    tray_padding 4

    colors {
        background #2e3440
        statusline #d8dee9
        separator  #4c566a

        focused_workspace  #88c0d0 #88c0d0 #2e3440
        active_workspace   #3b4252 #3b4252 #d8dee9
        inactive_workspace #2e3440 #2e3440 #d8dee9
        urgent_workspace   #bf616a #bf616a #eceff4
    }
}
